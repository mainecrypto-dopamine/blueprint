<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0A0A0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Blueprint HQ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="backend.js"></script>

<title>CP Medical × Blueprint</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=Noto+Sans+Thai:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Myanmar:wght@400;600&display=swap">
<style>
/* VOICE: the operations deck for a working grow: calm, exact, quick to use on a phone in a grow room
   IDEA: a blueprint: the building plan of the company, every room, batch and shift drawn to scale
   PICTURE: the grow-room board on Overview: each room a plan cell with its day count and progress line
   COLOUR and TYPE: Blueprint site palette: near-black, cream ink, gold accent, blueprint cyan; Michroma brand, Space Grotesk numbers, Inter body
   LAYOUT: Lunchbox HQ pattern: left rail on desktop, scrolling tab strip on phone; one view at a time */
:root{color-scheme:dark;--bg:#0a0a0a;--p1:#111;--p2:#181818;--line:#262626;--ink:#f0ebe3;--mute:#9c968d;--gold:#c8a96e;--cyan:#00aec7;--veg:#16a34a;--hot:#ff5a00;--bad:#e5484d}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,'Noto Sans Thai','Noto Sans Devanagari','Noto Sans Myanmar',system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
.num{font-family:'Space Grotesk',Inter,sans-serif;font-variant-numeric:tabular-nums}
h1{font-family:'Space Grotesk',Inter,sans-serif;font-weight:700;font-size:clamp(30px,4.2vw,44px);line-height:1.05;margin:0 0 6px;letter-spacing:-.015em;text-wrap:balance}
h2{font-family:'Space Grotesk',Inter,sans-serif;font-size:21px;margin:28px 0 12px}
.sub{color:var(--mute);margin:0 0 20px}
.app{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100vh}
aside{background:var(--p1);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.brand{margin:2px 6px 18px}.brand b{font-family:Michroma,sans-serif;font-weight:400;font-size:14px;letter-spacing:0;display:block;color:var(--ink);white-space:nowrap}.brand b i{font-style:normal;color:var(--gold)}
.brand small{color:var(--gold);font-size:14px;margin-top:4px;display:block}
nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:600;min-height:44px;border:1px solid transparent;white-space:nowrap}
nav a .ic{width:22px;text-align:center;color:var(--mute)}
nav a .n{margin-left:auto;font-size:12px;background:var(--p2);border-radius:6px;padding:1px 7px;color:var(--mute)}
nav a .n.hot{background:var(--hot);color:#fff}
nav a.on{background:#000;border-color:var(--cyan);color:var(--cyan)}nav a.on .ic{color:var(--cyan)}
.wclk{min-width:250px;border-left:1px solid rgba(0,174,199,.3);padding-left:20px;display:grid;gap:4px}
.wclk .bk{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}.wclk .bk b{font-family:'Space Grotesk',sans-serif;font-size:40px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}.wclk .bk span{color:var(--cyan);font-weight:600;font-size:14px}
.wclk .c{display:grid;grid-template-columns:minmax(0,1fr) auto 3.2em;gap:10px;align-items:baseline;font-size:14px;padding:3px 0;border-top:1px solid rgba(255,255,255,.06)}
.wclk .c span{color:var(--mute);white-space:nowrap}.wclk .c b{font-family:'Space Grotesk',sans-serif;font-size:17px;font-variant-numeric:tabular-nums}.wclk .c i{font-style:normal;color:var(--gold);font-size:13px;font-weight:600}
.wclk small{color:var(--mute);font-size:12px;margin-top:4px}
.side-foot{margin-top:auto;display:grid;gap:10px;font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:none;padding:8px 10px;min-height:40px;font-weight:600}
.seg button.on{background:var(--gold);color:#000}
select.me{background:var(--p2);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:44px}
main{padding:clamp(18px,3vw,36px) max(3.5vw,16px);max-width:1240px;width:100%}
.card{background:var(--p1);border:1px solid var(--line);border-radius:14px;padding:18px}
.banner{padding:10px 14px;border-radius:10px;background:#1d1608;color:var(--gold);font-size:14px;margin-bottom:14px;border:1px solid #3d3014;display:none}
.hero{position:relative;overflow:hidden;border:1px solid #12414a;border-radius:16px;padding:24px;background:linear-gradient(rgba(0,174,199,.09) 1px,transparent 1px) 0 0/26px 26px,linear-gradient(90deg,rgba(0,174,199,.09) 1px,transparent 1px) 0 0/26px 26px,#071013;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end}
.hero .big{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(56px,9vw,96px);line-height:.9;color:var(--gold)}
.hero .big small{font-size:.32em;color:var(--ink);font-weight:500;margin-left:8px}
.hero .lbl{color:var(--cyan);font-weight:600;font-size:14px;margin:0 0 8px}
.hero p{margin:8px 0 0}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}
.stat{background:var(--p1);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-decoration:none;color:var(--ink);display:block}
.stat .num{color:var(--ink);font-size:28px;font-weight:700;display:block;line-height:1.1}.stat span{color:var(--mute);font-size:13px}
.stat.warn .num{color:var(--hot)}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.room{background:var(--p1);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:8px;position:relative}
.room .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.room b{font-family:'Space Grotesk',sans-serif;font-size:18px}
.room .d{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:40px;line-height:1}
.room .d small{font-size:14px;color:var(--mute);font-weight:500}
.room .due{font-size:14px}.room .due.soon{color:var(--hot);font-weight:600}
.bar{height:8px;background:var(--p2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--gold)}
.st{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--p2);color:var(--mute);white-space:nowrap}
.st.flower{background:var(--gold);color:#000}.st.veg{background:var(--veg);color:#fff}.st.clone{background:#7fd1c7;color:#000}.st.mother{background:#c79bff;color:#000}.st.dry,.st.trim{background:var(--cyan);color:#000}
.st.passed,.st.yes{background:var(--veg);color:#fff}.st.failed{background:var(--bad);color:#fff}.st.pending,.st.submitted,.st.no{background:#3a2a0c;color:var(--gold)}
.bar.veg i{background:var(--veg)}.bar.dry i,.bar.trim i{background:var(--cyan)}
.head{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.head h1{margin:0}
.btn{border:1px solid var(--gold);background:var(--gold);color:#000;font-weight:700;border-radius:10px;padding:0 16px;min-height:44px}
.btn.gh{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{min-height:36px;padding:0 10px;font-size:14px;font-weight:600}
.btn.del{background:var(--bad);border-color:var(--bad);color:#fff}
input,select,textarea{background:var(--p2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px;width:100%;font-size:16px}
textarea{min-height:80px;resize:vertical}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tools input{width:240px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;color:var(--mute);font-size:13px;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right}td.r{font-family:'Space Grotesk',sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
td small{display:block;color:var(--mute);font-size:13px}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.empty{color:var(--mute);text-align:center;padding:30px 10px}
.tot{display:flex;gap:18px;flex-wrap:wrap;margin:0 0 14px;color:var(--mute);font-size:14px}.tot b{color:var(--ink);font-family:'Space Grotesk',sans-serif;font-size:20px;display:block}
.cl{display:grid;gap:8px}
.ck{display:flex;align-items:center;gap:12px;background:var(--p1);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-height:52px;cursor:pointer;text-align:left;width:100%}
.ck .box{width:24px;height:24px;border-radius:6px;border:2px solid var(--mute);flex:none;display:grid;place-items:center;font-weight:700}
.ck.done{border-color:#1d4d2c}.ck.done .box{background:var(--veg);border-color:var(--veg);color:#fff}
.ck.done .tx{color:var(--mute);text-decoration:line-through}
.ck small{margin-left:auto;color:var(--mute);font-size:13px;white-space:nowrap}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.pill{display:inline-block;font-size:13px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--p2);white-space:nowrap}.pill.open{background:var(--cyan);color:#000}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-start;justify-content:center;padding:4vh 14px;z-index:20;overflow-y:auto}
.ov.on{display:flex}
.modal{background:var(--p1);border:1px solid var(--line);border-radius:16px;padding:22px;width:min(560px,100%)}
.modal h2{margin:0 0 6px}.modal label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
.fg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 12px}.fg .w{grid-column:1/-1}
.hint{color:var(--mute);font-size:13px;margin:6px 0 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--gold);color:#000;font-weight:700;padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;z-index:30}
#toast.on{opacity:1;transform:translate(-50%,0)}
a.lk{color:var(--cyan)}
a.room{color:var(--ink);text-decoration:none;transition:border-color .2s}a.room:hover{border-color:var(--cyan)}
.room .rd{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--mute)}.room .rd span{white-space:nowrap}.room .rd b{color:var(--ink);font-family:'Space Grotesk',sans-serif}
.rtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.rtile{display:grid;align-content:space-between;min-height:150px;padding:18px;border-radius:16px;border:1px solid #17363c;color:var(--ink);text-decoration:none;background:linear-gradient(rgba(0,174,199,.08) 1px,transparent 1px) 0 0/22px 22px,linear-gradient(90deg,rgba(0,174,199,.08) 1px,transparent 1px) 0 0/22px 22px,#0b1214;transition:border-color .2s,transform .2s}
.envgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}.envc{width:100%;height:auto;display:block;touch-action:pan-y}.envlbl{font-size:12px;color:var(--mute);margin:8px 0 2px}.envslots{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.envslot{flex:1;min-width:92px;background:var(--p2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--ink);text-align:left;cursor:pointer;font:inherit}.envslot b{display:block;font-size:15px}.envslot span{font-size:12px;color:var(--mute)}.envslot.ok{border-color:rgba(22,163,74,.7)}.envslot.ok span{color:#4ade80}.envslot.bad{border-color:var(--bad)}.envslot.bad span{color:var(--bad)}.envslot.due{border-color:var(--hot)}.envslot.due span{color:var(--hot)}.envslot[disabled]{cursor:default}#envtip{position:fixed;display:none;z-index:99;background:#000;border:1px solid var(--line);color:var(--ink);font-size:12px;padding:6px 9px;border-radius:8px;pointer-events:none;max-width:280px}.rtile div span{display:block}.rtile .rcap{display:block;margin-top:4px;font-size:12px;font-weight:600;color:var(--gold);letter-spacing:.02em}
.rtile:hover,.rtile:focus-visible{border-color:var(--cyan);transform:translateY(-2px)}
.rtile span{font-family:Michroma,sans-serif;font-size:13px;letter-spacing:.08em;color:var(--cyan)}.rtile b{font-family:'Space Grotesk',sans-serif;font-size:64px;line-height:.9;font-weight:700}
.dd{display:flex;flex-wrap:wrap;gap:12px 40px;align-items:flex-end;margin-top:6px}.dd div b{display:block;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(56px,8vw,88px);line-height:.9;color:var(--gold)}.dd div.l b{color:var(--ink)}.dd div span{color:var(--mute);font-size:15px}
.bgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;align-items:start}
.bphoto{position:relative;border:1px solid #17363c;border-radius:14px;overflow:hidden;background:#0b1214;min-height:220px;display:grid;place-items:center;text-align:center;color:var(--mute);padding:0}
.bphoto img{display:block;width:100%;max-height:460px;object-fit:contain;background:#000}.bphoto .cap{position:absolute;left:0;right:0;bottom:0;padding:8px 12px;font-size:13px;background:linear-gradient(transparent,rgba(0,0,0,.85));color:var(--ink);text-align:left}
.snip{background:var(--p1);border:1px solid var(--cyan);border-radius:14px;padding:16px;display:grid;gap:12px}
.snip h3{margin:0;font-family:'Space Grotesk',sans-serif;font-size:16px;color:var(--cyan)}.snip p{margin:0;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start}.chip{background:var(--p2);border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:13px}.chip b{font-family:'Space Grotesk',sans-serif;margin-left:4px}
.snip ul{margin:0;padding-left:18px;font-size:14px}.snip .lbl{color:var(--mute);font-size:12px;font-weight:600;margin-bottom:2px}
.bthumbs{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:4px}.bthumbs button{flex:none;width:64px;height:64px;padding:0;border-radius:8px;border:2px solid var(--line);overflow:hidden;background:#000}.bthumbs button.on{border-color:var(--cyan)}.bthumbs img{width:100%;height:100%;object-fit:cover}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--cyan);border-right-color:transparent;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px;margin-right:6px}@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:760px){.bgrid{grid-template-columns:minmax(0,1fr)}}
.canopy{display:block;margin-top:14px;border-radius:14px;overflow:hidden;border:1px solid var(--line)}.canopy img{display:block;width:100%;max-height:340px;object-fit:cover}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.tcard{background:var(--p1);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;border-top:4px solid var(--tc,var(--cyan))}
.tcard h3{margin:0;font-family:'Space Grotesk',sans-serif;font-size:20px}
.person{display:flex;align-items:center;gap:10px}.av{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--p2);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;color:var(--mute);flex:none;overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}.av.sm{width:28px;height:28px;font-size:12px}
.person small{display:block;color:var(--mute);font-size:12px}.lead{background:var(--p2);border-radius:10px;padding:8px 10px}
.mem{display:flex;flex-wrap:wrap;gap:6px}.mem span{display:inline-flex;align-items:center;gap:6px;background:var(--p2);border-radius:99px;padding:3px 10px 3px 3px;font-size:13px}
.tsel{min-height:36px;padding:4px 8px;font-size:14px;width:auto;max-width:170px}
.msgbox{min-height:200px;font-size:15px;line-height:1.5}
.back{color:var(--cyan);text-decoration:none;font-weight:600;display:inline-block;margin-bottom:10px;min-height:32px}
.rh{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:end}
.rh .big{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(56px,8vw,88px);line-height:.9;color:var(--gold)}.rh .big small{font-size:.3em;color:var(--mute);font-weight:500}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}
.tile{background:var(--p1);border:1px solid var(--line);border-radius:12px;padding:12px 14px}.tile b{display:block;font-family:'Space Grotesk',sans-serif;font-size:24px;line-height:1.15}.tile span{color:var(--mute);font-size:13px}
.board{white-space:pre-wrap;font-size:15px;line-height:1.6;background:#0c1416;border:1px solid #17363c;border-radius:12px;padding:16px;min-height:90px}
.sh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:28px 0 12px}.sh h2{margin:0}
.items{margin:4px 0 0;padding:0;list-style:none;font-size:13px;color:var(--mute)}.items li{display:flex;justify-content:space-between;gap:10px}
.prev{max-height:50vh;overflow:auto;margin-top:10px}
.lock{position:fixed;inset:0;z-index:40;background:linear-gradient(rgba(0,174,199,.07) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,rgba(0,174,199,.07) 1px,transparent 1px) 0 0/28px 28px,#0a0a0a;display:none;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.lock.on{display:flex}.lockin{width:min(440px,100%);text-align:center}
.lockin .wm{font-family:Michroma,sans-serif;font-size:clamp(14px,4vw,20px);letter-spacing:.04em;margin-bottom:22px}.lockin .wm i{font-style:normal;color:var(--gold)}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:16px}
.people button{background:var(--p1);border:1px solid var(--line);border-radius:12px;min-height:56px;font-weight:600;padding:8px}.people button small{display:block;color:var(--mute);font-weight:400;font-size:12px}
.pin{font-size:28px;letter-spacing:.5em;text-align:center;font-family:'Space Grotesk',sans-serif;max-width:240px;margin:14px auto 0}
.whob{background:var(--p2);border:1px solid var(--line);border-radius:10px;min-height:44px;padding:6px 10px;text-align:left;font-weight:600;font-size:14px}.whob small{display:block;color:var(--gold);font-weight:500;font-size:12px}
.thumb{width:44px;height:44px;object-fit:cover;border-radius:6px;border:1px solid var(--line);float:left;margin-right:10px}
.feed{display:grid;gap:8px;font-size:14px}.feed div{display:flex;gap:10px;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:8px}.feed span{color:var(--mute);white-space:nowrap}
@media(prefers-reduced-motion:no-preference){#toast{transition:.25s}.bar i{transition:width .6s}}
@media(max-width:900px){.app{grid-template-columns:minmax(0,1fr)}aside{position:sticky;height:auto;z-index:10;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;padding:10px 10px 6px;border-right:0;border-bottom:1px solid var(--line)}
.brand{margin:0 0 0 4px}.brand small{display:none}.brand b{font-size:10.5px}nav{grid-column:1/-1;grid-row:2;display:flex;gap:4px;overflow-x:auto;padding-bottom:4px}nav a{flex:none;min-height:40px;padding:6px 10px}.side-foot{margin:0;display:flex;gap:6px;grid-column:2;grid-row:1}.side-foot .hint{display:none}.side-foot .seg button{padding:6px 9px;min-height:36px}.whob{min-height:36px;padding:4px 8px;max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.whob small{display:none}

function trTo(src,L){if(L==='en'||!I18N[L])return src;const D=I18N[L];let k=src.trim();if(!k)return src;
 if(D[k]!==undefined)return src.replace(k,D[k]);
 const wd=WD.indexOf(k);if(wd>=0)return src.replace(k,WDL[L][wd]);
 let k2=k.replace(/\b(Sun|Mon|Tue|Wed|Thu|Fri|Sat) (\d{1,2}) (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\b/g,(x,a,b,c)=>WDL[L][WD.indexOf(a)]+' '+b+' '+MOL[L][MO.indexOf(c)])
  .replace(/\b(\d{1,2}) (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)( \d{4})?\b/g,(x,b,c,y)=>b+' '+MOL[L][MO.indexOf(c)]+(y||''))
  .replace(/^(Sun|Mon|Tue|Wed|Thu|Fri|Sat)(?= · )/,x=>WDL[L][WD.indexOf(x)]);
 if(D[k2]!==undefined)return src.replace(k,D[k2]);
 for(const[re,o]of PAT){const m=k2.match(re);if(m&&o[L])return src.replace(k,o[L](m))}
 return k2===k?src:src.replace(k,k2)}

function trTree(root){if(!root)return;
 const one=n=>{if(n.nodeType===3){const p=n.parentNode;if(!p||/^(SCRIPT|STYLE|TEXTAREA)$/.test(p.nodeName))return;if(n.__en===undefined||(n.__tr!==undefined&&n.nodeValue!==n.__tr))n.__en=n.nodeValue;const v=trText(n.__en);if(n.nodeValue!==v)n.nodeValue=v;n.__tr=v}
  else if(n.nodeType===1){if(n.__ena===undefined)n.__ena={};for(const a of TR_ATTR){if(!n.hasAttribute(a))continue;const cur=n.getAttribute(a);if(n.__ena[a]===undefined||cur!==n.__tra?.[a])n.__ena[a]=cur;const v=trText(n.__ena[a]);(n.__tra||(n.__tra={}))[a]=v;if(cur!==v)n.setAttribute(a,v)}}};
 one(root);if(root.nodeType!==1)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_ELEMENT|NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode())one(n)}
const trObs=new MutationObserver(recs=>{trObs.disconnect();for(const r of recs){if(r.type==='childList')r.addedNodes.forEach(trTree);else trTree(r.target)}trObs.takeRecords();trObs.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:TR_ATTR})});

const dStr=n=>{const d=new Date(n*864e5);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())};

const normS=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');

function plan(){const td=dnum(todayStr()),out=[],defs=defList(CFG.defol||'21,41');

 for(const r of S.rooms){const n=roomNow(r);if(n.st!=='flower'&&n.st!=='veg')continue;
  const push=(d,k,label)=>out.push({room:r.id,rname:r.name,d,k,label,key:r.id+'~'+k+'~'+dStr(d)});
  const strains=strainsOf(r),rcs=strains.map(x=>recipeFor(x.name)).filter(Boolean);
  const rVeg=rcs.length?Math.max(...rcs.map(x=>+x.veg||veg)):veg;
  let fl=n.st==='flower'?td-(n.day-1):td+Math.max(0,rVeg-n.day);
  if(n.st==='veg')push(fl,'flip',`Flip to 12/12 · after ${rVeg} days veg`);
  for(let c=0;c<3;c++){
   // flip groups: strains with their own flip date, else the room's
   let gs;if(c===0){const m=new Map();for(const st of strains){const f=st.flip?dnum(st.flip):NaN;const k=isNaN(f)?fl:f;if(!m.has(k))m.set(k,[]);m.get(k).push(st.name)}if(!m.size)m.set(fl,[]);gs=[...m.entries()].sort((x,y)=>x[0]-y[0])}else gs=[[fl,[]]];
   const multi=gs.length>1;let h=-Infinity;

    const L=c===0&&+r.len>0?+r.len:rc.length?Math.max(...rc.map(x=>+x.flower||dflt)):dflt;
    const gd=rc.length&&defList(rc[0].defol).length?defList(rc[0].defol):defs;const tag=multi&&names.length?' · '+names.join(', '):'';

    const gh=g+L-1;push(gh,'harvest',`Harvest · flower day ${L} → dry room`+tag);h=Math.max(h,gh)}
   push(h+dry,'trim',`Trim & pack · after ${dry} days drying`);push(h+ca,'clean','Clean & sanitize room');push(h+pa,'plant','Plant next cycle (veg starts)');
   const nf=h+pa+veg;push(nf,'flip',`Flip to 12/12 · after ${veg} days veg`);fl=nf}}

function useRate(it){const td=dnum(todayStr()),from=td-30,M=S.moves.filter(m=>m.item===it.id),U=M.filter(m=>m.kind==='use'&&dnum(m.date)>=from);if(!U.length)return 0;
 const first=Math.min(...M.map(m=>dnum(m.date)).filter(n=>!isNaN(n)));const span=Math.max(7,Math.min(30,td-Math.max(from,first)+1));return U.reduce((a,m)=>a+(+m.qty||0),0)/span}

 const days=rate>0&&oh!=null?oh/rate:null,sugMin=rate>0?Math.ceil(rate*(lead+7)):null,minEff=min!=null?min:sugMin;

async function applyMove(it,kind,qty,extra){const was=numOr(it.onHand),oh=was||0;const nv=kind==='count'?qty:kind==='receive'?oh+qty:was==null?null:Math.max(0,oh-qty);
 const d={...it};delete d.id;d.onHand=nv==null?'':Math.round(nv*1000)/1000;if(kind==='count')d.counted=todayStr();if(kind==='receive'&&extra.lot)d.lot=extra.lot;if(kind==='receive'&&extra.cost)d.cost=extra.cost;if(kind==='receive')delete d.req;d.updatedAt=Date.now();d.updatedBy=me;
 await put('moves','mv'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),{item:it.id,itemName:it.name,kind,qty,before:numOr(it.onHand),after:d.onHand,date:todayStr(),by:me,ts:Date.now(),...extra});
 await put('items',it.id,d)}

 </tbody></table></div>
 <div class="sh"><h2>Brands we carry</h2><button class="btn sm" id="brAdd">+ Brand</button></div>

/* ---------- feed charts ---------- */
const feedsL=()=>[...S.feeds].sort((a,b)=>String(a.name).localeCompare(b.name));
const feedOf=r=>S.feeds.find(f=>f.id===r.feed)||null;
function phaseIx(f,r){const n=roomNow(r),P=Array.isArray(f.phases)?f.phases:[];if(!P.length)return-1;
 if(n.st==='veg'){const i=P.findIndex(p=>p.stage==='veg');return i}
 if(n.st!=='flower')return-1;const w=Math.max(1,Math.ceil(n.day/7)),L=Math.max(w,Math.ceil((n.len||63)/7));
 let i=P.findIndex(p=>p.stage==='flush'&&/^last(\d+)$/.test(p.wk||'')&&w>L-+(p.wk.match(/\d+/)[0]));if(i>=0)return i;
 i=P.findIndex(p=>p.stage==='flower'&&/^last(\d+)$/.test(p.wk||'')&&w>L-+(p.wk.match(/\d+/)[0]));if(i>=0)return i;
 i=P.findIndex(p=>{if(p.stage!=='flower')return false;const m=String(p.wk||'').match(/^(\d+)\s*-\s*(\d*)$/);if(!m)return!p.wk;return w>=+m[1]&&(m[2]===''||w<=+m[2])});return i}
const toStock=(it,amtPerL,unit,L)=>{const raw=amtPerL*L,u=String(it.unit||'');if(unit==='g/L'){if(u==='kg')return raw/1000;if(u==='g')return raw}else if(unit==='mL/L'){if(u==='L')return raw/1000;if(u==='mL')return raw}return null};
const fmtAmt=(v,unit)=>{const g=unit==='g/L';return v>=1000?(Math.round(v/10)/100)+(g?' kg':' L'):(Math.round(v*10)/10)+(g?' g':' mL')};
let feedSel={},feedL={};
function feedBlock(r){const F=feedsL();if(!F.length)return`<div class="sh"><h2>Feed</h2>${canWrite&&allowed().includes('feeds')?`<a class="btn gh sm" href="#feeds" style="text-decoration:none">Set up feed charts</a>`:''}</div>`;
 const f=feedOf(r)||F[0],P=f.phases||[],cur=phaseIx(f,r),sel=feedSel[r.id]??cur,ph=P[sel],L=feedL[r.id]??(+r.tankL||1000);
 return`<div class="sh"><h2>Feed</h2><div class="tools">${canWrite?`<select data-rfeed="${esc(r.id)}" aria-label="Feed chart">${F.map(x=>`<option value="${esc(x.id)}" ${x.id===f.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`:`<b>${esc(f.name)}</b>`}</div></div>
 <div class="chips" style="margin-bottom:10px">${P.map((p,i)=>`<button class="chip" data-fph="${esc(r.id)}:${i}" style="cursor:pointer;padding:8px 14px;${i===sel?'background:var(--gold);color:#111;border-color:var(--gold)':i===cur?'border-color:var(--gold);color:var(--gold)':''}"><b>${esc(p.label)}</b>${p.wk&&p.stage==='flower'?` <span style="opacity:.75">${/^last/.test(p.wk)?'final '+esc(p.wk.slice(4))+' wk':'wk '+esc(String(p.wk).replace(/-$/,'+'))}</span>`:''}${i===cur?' ●':''}</button>`).join('')}</div>
 ${ph?`<div class="card"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center"><div><b style="font-size:18px">${esc(ph.label)}</b>${i18nNow(cur,sel)}${ph.ec?` · <span>EC</span> <b>${esc(ph.ec)}</b>`:''}${ph.ph?` · <span>pH</span> <b>${esc(ph.ph)}</b>`:''}</div>
  <label class="hint" style="display:flex;align-items:center;gap:8px;margin:0">Litres to mix <input type="number" min="1" step="any" data-fl="${esc(r.id)}" value="${esc(L)}" style="width:110px"></label></div>
  ${(ph.doses||[]).length?`<table style="margin-top:8px"><thead><tr><th>Product</th><th class="r">Per litre</th><th class="r">For ${esc(L)} L</th><th class="r">In stock</th></tr></thead><tbody>${ph.doses.map(d=>{const it=S.items.find(i=>i.id===d.item)||{name:d.name||'?'};const tot=(+d.amt||0)*L,need=toStock(it,+d.amt||0,d.unit,L),oh=numOr(it.onHand);return`<tr><td>${(brandOf(it.brand)||{}).logo?logoImg(brandOf(it.brand),16)+' ':''}<b>${esc(it.name)}</b></td><td class="r">${esc(d.amt)} ${esc(d.unit)}</td><td class="r"><b style="font-size:17px">${fmtAmt(tot,d.unit)}</b></td><td class="r">${oh==null?'<span class="hint" style="display:inline">not counted</span>':`<span style="color:${need!=null&&oh<need?'var(--red,#e5484d)':'inherit'}">${fmtQ(oh)} ${esc(it.unit||'')}</span>`}</td></tr>`}).join('')}</tbody></table>
  ${canWrite?`<div class="acts" style="justify-content:flex-start;margin-top:10px"><button class="btn sm" data-fmix="${esc(r.id)}:${sel}">Log this mix · take from stock</button></div>`:''}`:`<p class="hint">No products in this phase${ph.stage==='flush'?' (plain water)':''}.</p>`}${ph.notes?`<p class="hint" style="margin:8px 0 0">${esc(ph.notes)}</p>`:''}</div>`:`<div class="card empty">This room isn't in a feeding stage.</div>`}`}
const i18nNow=(cur,sel)=>cur===sel?' <span class="st flower">this week</span>':'';
async function logMix(rid,pi){const r=S.rooms.find(x=>x.id===rid);if(!r)return;const f=feedOf(r)||feedsL()[0];const ph=f&&f.phases[pi];if(!ph)return;const L=+(feedL[rid]??(+r.tankL||1000));if(!(L>0))return;
 let n=0,skip=[];try{for(const d of ph.doses||[]){const it=S.items.find(i=>i.id===d.item);if(!it){skip.push(d.name||d.item);continue}const q=toStock(it,+d.amt||0,d.unit,L);if(q==null){skip.push(it.name);continue}if(q>0){await applyMove(it,'use',Math.round(q*1000)/1000,{room:rid,note:`Feed mix · ${f.name} · ${ph.label} · ${L} L`});n++}}
  toast(n+' products taken from stock'+(skip.length?' · check units for '+skip.join(', '):''))}catch(err){banner(errMsg(err))}}
function vFeeds(){const F=feedsL();
 return`<div class="head"><div><h1>${t('feeds')}</h1><p class="sub" style="margin:0">Each chart is a row of phase buttons on the room pages. Doses are per litre; the room page multiplies them by the litres you mix and can take them straight off the inventory.</p></div><div class="tools">${canWrite?`<button class="btn" id="fdAdd">+ Feed chart</button>`:''}</div></div>
 ${F.length?F.map(f=>{const P=f.phases||[],items=[...new Set(P.flatMap(p=>(p.doses||[]).map(d=>d.item)))];const rooms=S.rooms.filter(r=>(feedOf(r)||F[0]).id===f.id).sort(byName);
  return`<div class="sh"><h2>${esc(f.name)}</h2><div class="tools">${canWrite?`<button class="btn gh sm" data-fded="${esc(f.id)}">${t('edit')}</button>`:''}</div></div>${f.notes?`<p class="hint" style="margin-top:0">${esc(f.notes)}</p>`:''}
  <div class="card" style="padding:6px 10px;overflow:auto"><table><thead><tr><th>Per litre</th>${P.map(p=>`<th class="r">${esc(p.label)}${p.wk&&p.stage==='flower'?`<small style="display:block;font-weight:400">${/^last/.test(p.wk)?'final '+esc(p.wk.slice(4))+' wk':'wk '+esc(String(p.wk).replace(/-$/,'+'))}</small>`:''}</th>`).join('')}</tr></thead><tbody>
  ${items.map(id=>{const it=S.items.find(i=>i.id===id)||{name:id};return`<tr><td><b>${esc(it.name)}</b></td>${P.map(p=>{const d=(p.doses||[]).find(x=>x.item===id);return`<td class="r">${d?esc(d.amt)+' <small style="display:inline">'+esc(d.unit)+'</small>':'—'}</td>`}).join('')}</tr>`}).join('')}
  <tr><td>EC</td>${P.map(p=>`<td class="r">${esc(p.ec||'—')}</td>`).join('')}</tr><tr><td>pH</td>${P.map(p=>`<td class="r">${esc(p.ph||'—')}</td>`).join('')}</tr></tbody></table></div>
  <p class="hint">${rooms.length?'Used in '+rooms.map(r=>`<a class="lk" href="#room-${esc(r.id)}">${esc(r.name)}</a>`).join(', '):'Not used in any room yet.'}</p>`}).join(''):`<div class="card empty">No feed charts yet.</div>`}`}
function feedForm(id){const f=id?S.feeds.find(x=>x.id===id):{name:'',notes:'',phases:[{label:'Veg',stage:'veg',wk:'',ec:'',ph:'',doses:[]},{label:'Flower',stage:'flower',wk:'1-',ec:'',ph:'',doses:[]},{label:'Flush',stage:'flush',wk:'last1',ec:'',ph:'',doses:[]}]};if(!f)return;MF={fd:1};
 let P=JSON.parse(JSON.stringify(f.phases||[]));let items=[...new Set(P.flatMap(p=>(p.doses||[]).map(d=>d.item)))];
 const unitOf=id=>{for(const p of P)for(const d of p.doses||[])if(d.item===id)return d.unit;const it=S.items.find(i=>i.id===id);return it&&(it.unit==='L'||it.unit==='mL')?'mL/L':'g/L'};
 const draw=()=>{$('fdG').innerHTML=`<table><thead><tr><th>Phase</th>${P.map((p,i)=>`<th><input data-fp="label:${i}" value="${esc(p.label)}" style="width:92px" aria-label="Phase name"></th>`).join('')}<th><button class="btn gh sm" type="button" id="fdPh">+ Phase</button></th></tr></thead><tbody>

  ${items.map(id=>{const it=S.items.find(i=>i.id===id)||{name:id};const u=unitOf(id);return`<tr><td><b>${esc(it.name)}</b><small style="display:block">${u} <button class="btn gh sm" type="button" data-fx="${esc(id)}" style="padding:0 6px;min-height:0">✕</button></small></td>${P.map((p,i)=>{const d=(p.doses||[]).find(x=>x.item===id);return`<td><input type="number" step="any" min="0" data-fdz="${esc(id)}:${i}" value="${d?esc(d.amt):''}" style="width:92px"></td>`}).join('')}<td></td></tr>`}).join('')}
  <tr><td class="hint">EC</td>${P.map((p,i)=>`<td><input data-fp="ec:${i}" value="${esc(p.ec||'')}" style="width:92px"></td>`).join('')}<td></td></tr>

  <tr><td></td>${P.map((p,i)=>`<td><button class="btn gh sm" type="button" data-fpx="${i}">Remove</button></td>`).join('')}<td></td></tr></tbody></table>`;trTree($('fdG'))};
 const sync=()=>{document.querySelectorAll('[data-fp]').forEach(el=>{const[k,i]=el.dataset.fp.split(':');P[+i][k]=el.value.trim()});

 $('mf').innerHTML=`<h2>${id?esc(f.name):'New feed chart'}</h2><label for="fdN">Name</label><input id="fdN" value="${esc(f.name)}" maxlength="60" placeholder="e.g. Athena Pro, House recipe"><label for="fdO">Notes</label><input id="fdO" value="${esc(f.notes||'')}">

let pdfReady=null;
function loadPdf(){if(pdfReady)return pdfReady;const add=src=>new Promise((ok,no)=>{const sc=document.createElement('script');sc.src=src;sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)});

async function pdfImages(file,max){const lib=await loadPdf();const doc=await lib.getDocument({data:await file.arrayBuffer(),disableWorker:true}).promise;const out=[];
 for(let i=1;i<=Math.min(doc.numPages,max||3);i++){const pg=await doc.getPage(i),vp=pg.getViewport({scale:1.6}),c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;out.push(await new Promise(r=>c.toBlob(r,'image/jpeg',.85)))}return out}

const SCAN_PROMPT=`You digitize paper records for House of Strains, a cannabis cultivation company in Thailand. Read the attached image and return ONLY JSON: {"type":"shifts"|"expenses"|"readings"|"batch"|"invoice"|"other","title":"short name of the document","summary":"one sentence","rows":[...]}.
Row shapes by type:
shifts (daily work log): {"date":"YYYY-MM-DD","name":"","tin":"HH:MM","tout":"HH:MM","rate":100,"task":"room or job","paid":"yes"|"no"}
expenses: {"date":"YYYY-MM-DD","item":"","amount":0,"by":"","notes":""}
readings (room board / climate log): {"room":"Room 1","date":"YYYY-MM-DD","time":"HH:MM","temp":0,"rh":0,"ec":0,"ph":0,"notes":""}
batch (batch record or COA, one row): {"no":"","cultivar":"","room":"","plants":0,"planted":"YYYY-MM-DD","harvest":"YYYY-MM-DD","wet":grams,"dry":grams,"thc":percent,"coa":"pending"|"submitted"|"passed"|"failed","lab":"","notes":""}
invoice (bill or purchase request, one row): {"no":"","kind":"Invoice"|"Purchase request","vendor":"","date":"YYYY-MM-DD","items":[{"d":"description","q":1,"p":0}],"discount":0,"paid":0,"notes":""}
Use 24-hour times. Years are 2026 unless written otherwise; Thai Buddhist years (2569) are 2026. Amounts in baht as plain numbers. Leave a field empty if you cannot read it; never guess names or numbers.`;
async function uploadOriginal(file){if(!assets)return;
 banner('Uploading original…');let a;try{a=await assets.upload(file)}catch(err){banner('Upload failed: '+(err&&err.message||'try again'));return}
 const id='d'+Date.now().toString(36);const rec={title:file.name.replace(/\.[^.]+$/,'').slice(0,120),cat:'Records',url:'',asset:a.id,ctype:a.contentType||file.type,digitized:'',notes:'',updatedBy:me,updatedAt:Date.now()};
 try{await put('docs',id,rec)}catch(err){banner(errMsg(err));return}banner('');toast('Original saved');
 if(/^image\//.test(file.type)&&sample&&canImg)digitize(id,file)}
async function scanExisting(d){try{const r=await fetch('/_blob/'+encodeURIComponent(d.asset));if(!r.ok)throw 0;digitize(d.id,await r.blob())}catch(e){banner('Could not open the original to read it.')}}
async function digitize(docId,blob){banner('Reading the record… this takes a few seconds.');let out;
 try{out=await sample.json(SCAN_PROMPT,{images:[blob],modelTier:'default'})}catch(err){banner(err&&err.code==='rate_limited'?'Too many scans just now. Try again in a minute.':'Could not read this record. You can still type it in.');return}
 banner('');if(!out||!Array.isArray(out.rows)||!out.rows.length||out.type==='other'){toast('Nothing to digitize found');return}
 SCAN={docId,type:out.type,title:String(out.title||''),summary:String(out.summary||''),rows:out.rows.slice(0,100)};showScan()}
const SC={shifts:['shifts',['date','name','tin','tout','rate','task','paid']],expenses:['expenses',['date','item','amount','by','notes']],readings:['readings',['room','date','time','temp','rh','ec','ph','notes']],batch:['batches',['no','cultivar','room','plants','harvest','dry','thc','coa','lab']],invoice:['bills',['no','kind','vendor','date','discount','paid']],coa:['coas',['report','date','lab','batch','strain','thc','result']],export:['exports',['ref','date','buyer','country','permit','awb','status']]};
function showScan(){const sc=SC[SCAN.type];if(!sc){toast('Unknown record type');return}MF={scan:1};const cols=sc[1];
 $('mf').innerHTML=`<h2>Digitized: ${esc(SCAN.title||SCAN.type)}</h2><p class="hint">${esc(SCAN.summary)} Check it against the original, then add it. You can edit any row afterwards.</p>
 <div class="prev"><table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}${SCAN.type==='invoice'?'<th>items</th>':''}${SCAN.type==='export'?'<th>products</th>':''}</tr></thead><tbody>${SCAN.rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c]??'')}</td>`).join('')}${SCAN.type==='invoice'?`<td>${esc((r.items||[]).length)} lines</td>`:''}${SCAN.type==='export'?`<td>${esc((r.lines||[]).map(l=>l.strain+' '+l.kg+'kg').join(', '))}</td>`:''}</tr>`).join('')}</tbody></table></div>
 <p class="hint" id="fmsg"></p><div class="acts" style="justify-content:flex-start;margin-top:16px"><button class="btn" type="button" id="scOk">Add ${SCAN.rows.length} to ${esc(t(sc[0]))}</button><button class="btn gh" type="button" id="fx">${t('cancel')}</button></div>`;
 $('ov').classList.add('on');$('fx').onclick=closeForm;$('scOk').onclick=importScan}

 try{for(const r of SCAN.rows){const d={};for(const[k,,ty]of F[col]){let v=r[k];if(ty==='number')v=v===''||v==null||isNaN(+v)?'':+v;else if(ty==='items')v=(Array.isArray(v)?v:[]).slice(0,60).map(i=>({d:String(i.d||''),q:+i.q||1,p:+i.p||0}));else if(ty==='roomsel')v=roomId(v);else if(ty==='lines')v=(Array.isArray(v)?v:[]).slice(0,60).map(i=>({strain:String(i.strain||''),batch:String(i.batch||''),kg:+i.kg||''}));else v=v==null?'':String(v).slice(0,500);d[k]=v}

  if(col==='coas')await syncCoa(d);d.source=SCAN.docId;d.updatedBy=me;d.updatedAt=Date.now();const id=col.slice(0,2)+Date.now().toString(36)+Math.random().toString(36).slice(2,5);await put(col,id,d);ids.push(id)}

  closeForm();toast(`Added ${ids.length} to ${t(col)}`);SCAN=null}catch(err){$('fmsg').textContent=errMsg(err)+(ids.length?` (${ids.length} added before the error)`:'');$('scOk').disabled=false}}

function goLocal(msg){LOCAL=true;try{let d=JSON.parse(localStorage.getItem('bp-data')||'null');const sd=window.BP_SEED;if(sd&&(!d||d.seedAt!==sd.at)){d=sd;seedAt=sd.at;loadSnap(d);lsave()}else{if(d)seedAt=d.seedAt||0;loadSnap(d)}}catch(e){}$('sync').textContent=msg;loaded=true;render()}
let todayKey='',unToday=null;
function watchToday(){const k=todayStr();if(k===todayKey||LOCAL||!db)return;todayKey=k;if(unToday)unToday();TODAY={items:{}};unToday=db.doc('ops/'+k).onSnapshot(d=>{TODAY=d.exists?d.data():{items:{}};render()},()=>{})}
(async()=>{
 render();trTree(document.body);
 const cl=window.claude;if(window.BP_OFFLINE){goLocal('Offline copy from '+(window.BP_SEED&&window.BP_SEED.at?fmtD(bkDay(window.BP_SEED.at)):'a download')+'. Changes stay on this computer.');return}if(!cl||!cl.use){goLocal('Not synced: saved on this device only.');return}
 db=await cl.use('db');if(!db){goLocal('Shared data unavailable: saved on this device only.');return}
 try{assets=await cl.use('assets')}catch(e){}
 try{DL=await cl.use('downloads')}catch(e){}
 try{sample=await cl.use('sample');if(sample&&sample.limits){const l=await sample.limits();canImg=!!(l&&l.images)}}catch(e){sample=null}
 try{const u=await cl.use('user');if(u&&u.can){const w=await u.can('data.write');if(w===false){canWrite=false;banner(t('readonly'))}}}catch(e){}
 const timer=setTimeout(()=>{if(!loaded)$('sync').textContent='Can\'t reach the shared data yet.'},10000);
 COLS.forEach(c=>db.collection(c).onSnapshot(s=>{S[c]=s.docs.map(d=>({...d.data(),id:d.id}));if(!s.metadata.fromCache&&!loaded){loaded=true;clearTimeout(timer);$('sync').textContent=canWrite?'Live · synced for the team':'Live · view only'}if(!MF)render()},err=>{$('sync').textContent='Disconnected. Reopen to reconnect.'}));
 db.doc('meta/settings').onSnapshot(d=>{CFG={...DEF_CFG,...(d.exists?d.data():{})};render()},()=>{});
 db.doc('meta/team').onSnapshot(d=>{TEAM=d.exists&&Array.isArray(d.data().people)?d.data().people:[];render()},()=>{});
 db.doc('meta/checklist').onSnapshot(d=>{if(d.exists){const x=d.data();CL={open:Array.isArray(x.open)?x.open:[],close:Array.isArray(x.close)?x.close:[]}}if(!MF)render()},()=>{});
 watchToday();
})();
setInterval(()=>{watchToday();if(!MF&&!(document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.q))render()},60000);
}
</script>
<script>if("serviceWorker" in navigator&&!window.BP_OFFLINE)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))</script>
